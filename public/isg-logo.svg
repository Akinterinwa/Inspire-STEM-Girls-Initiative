<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3328" />
      <stop offset="50%" stop-color="#0e4b3c" />
      <stop offset="100%" stop-color="#155e4b" />
    </linearGradient>

    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#031b14" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#logoBgGrad)" filter="url(#logoShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.35" />

  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="180" ry="68" fill="none" stroke="url(#logoGold)" stroke-width="14" transform="rotate(-35 256 256)" opacity="0.95" />
  <ellipse cx="256" cy="256" rx="180" ry="68" fill="none" stroke="#34d399" stroke-width="12" stroke-opacity="0.85" transform="rotate(35 256 256)" />

  <!-- Node Dots -->
  <circle cx="118" cy="160" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
  <circle cx="394" cy="352" r="14" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
  <circle cx="394" cy="160" r="12" fill="#34d399" stroke="#ffffff" stroke-width="3" />
  <circle cx="118" cy="352" r="12" fill="#34d399" stroke="#ffffff" stroke-width="3" />

  <!-- Core Spark & Flask Symbol -->
  <g transform="translate(256 256)">
    <circle cx="0" cy="0" r="76" fill="#042017" opacity="0.6" />
    <circle cx="0" cy="0" r="62" fill="url(#logoGold)" opacity="0.25" />

    <!-- 4-point radiant star -->
    <path d="M 0,-88 Q 8,-20 80,0 Q 8,20 0,88 Q -8,20 -80,0 Q -8,-20 0,-88 Z" fill="url(#logoGold)" />
    
    <!-- Diagonal Flares -->
    <path d="M -42,-42 Q -6,-6 0,-42 Q 6,-6 42,-42 Q 6,6 42,42 Q -6,6 -42,42 Q -6,-6 -42,-42 Z" fill="#ffffff" opacity="0.5" />

    <!-- Scientific Flask & Sparkle -->
    <path d="M -14,-34 L 14,-34 L 14,-18 L 32,24 C 36,32 30,42 20,42 L -20,42 C -30,42 -36,32 -32,24 L -14,-18 Z" fill="#ffffff" />
    <path d="M -10,-10 L 10,-10 L 24,26 C 26,30 22,36 16,36 L -16,36 C -22,36 -26,30 -24,26 Z" fill="#0e4b3c" />
    <circle cx="-6" cy="22" r="4" fill="#fbbf24" />
    <circle cx="7" cy="16" r="3" fill="#34d399" />
    <circle cx="2" cy="28" r="4.5" fill="#f59e0b" />

    <!-- Star Crown -->
    <polygon points="0,-48 4,-38 14,-38 6,-32 9,-22 0,-27 -9,-22 -6,-32 -14,-38 -4,-38" fill="#ffffff" />
  </g>
</svg>
